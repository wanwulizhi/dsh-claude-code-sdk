# Bundle wiring for `dsh plugin add` / registry installs.
# A saved profile entry can override any field below by targeting the id.
- insert:
    - id: claude-code-sdk
      name: dsh-claude-code-sdk
      config:
        model: sonnet
        permissionMode: acceptEdits
        # bypassPermissions 必须同时显式开启，否则插件会拒绝该模式（安全开关）
        allowDangerouslySkipPermissions: false
        # 单次委派会独占回合，上限压到 40 轮 / 5 分钟，避免一次调用拖十几分钟
        maxTurns: 40
        timeoutMs: 300000
        effort: high
        # Non-interactive mode denies anything not pre-approved, so the shell
        # and the file tools are allowed here by default.
        allowedTools:
          - Bash
          - PowerShell
          - Read
          - Write
          - Edit
          - Glob
          - Grep
          - WebFetch
          - WebSearch
        # Tools to REMOVE from the worker. This is the only lever that shrinks the
        # worker's system prompt: measured 11,993 -> 7,760 input tokens (-35%) with
        # the read-only set below. Empty by default; enable it when you only run
        # read-only delegations.
        disallowedTools: []
        # disallowedTools: [Write, Edit, Bash, PowerShell, WebFetch, WebSearch, NotebookEdit, Task, TodoWrite]
        # Inject the current DSH conversation (user/assistant text) into the task.
        includeHistory: true
        historyMaxMessages: 20
        historyMaxChars: 12000
        # Snapshot the workspace before/after a delegation: reports which files
        # changed and enables claude_code_revert. A tree that exceeds the file
        # or time budget is left untracked rather than producing a partial diff.
        trackChanges: true
        maxTrackedFileSize: 524288
        maxTrackedTotalBytes: 67108864
        maxTrackedFiles: 8000
        maxTrackedMs: 1000
        keepSnapshots: 20
        # Whether the delegation skill is advertised to the model so it can decide
        # on its own to hand work over. Off by default: without Claude Mode the
        # leader should delegate only when you ask. Set true for opportunistic
        # delegation.
        autoDelegate: false
